                                        <option value="Founder">Founder / Venture Creator</option>
                                        <option value="Research">Published Research Author</option>
                                        <option value="Corporate Leadership">Corporate Executive Path</option>
                                        <option value="Social Impact">National Social Impact</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Calculated Results Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {filteredMatches.map((uni) => (
                                <div key={uni.id} className="bg-charcoal/60 border border-gold/15 p-6 hover:border-gold/40 transition-all flex flex-col justify-between group">
                                    <div>
                                        <div className="flex justify-between items-start mb-4">
                                            <span className="text-[9px] uppercase tracking-superwide text-gold border border-gold/20 px-2 py-0.5">
                                                {uni.tier}
                                            </span>
                                            <span className="text-[10px] text-ecruMuted">
                                                Acceptance: <span className="text-gold">{uni.acceptanceRate}</span>
                                            </span>
                                        </div>

                                        <h3 className="font-serif text-2xl text-ecru mb-1 group-hover:text-gold transition-colors">{uni.name}</h3>
                                        <p className="text-[11px] text-ecruMuted/70 mb-4">{uni.location}</p>

                                        <div className="space-y-2 mb-6 border-t border-b border-gold/10 py-3 text-xs">
                                            <div className="flex justify-between">
                                                <span className="text-ecruMuted">Academic Baseline:</span>
                                                <span className="text-ecru font-medium">{uni.minGPA}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-ecruMuted">Portfolio Weight:</span>
                                                <span className="text-gold text-right text-[11px] max-w-[160px] truncate">{uni.portfolioWeight}</span>
                                            </div>
                                        </div>

                                        <p className="text-[11px] text-ecruMuted font-light leading-relaxed italic mb-6">
                                            "{uni.strategySnippet}"
                                        </p>
                                    </div>

                                    <button 
                                        onClick={() => triggerAssessmentWithTarget(uni.name)}
                                        className="w-full py-3 border border-gold/30 text-gold hover:bg-gold hover:text-obsidian text-[10px] uppercase tracking-ultra transition-all text-center">
                                        Align Strategy for {uni.name.split(' ')[0]}
                                    </button>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Senior Faculty Profiles */}
                    <section id="faculty" className="py-24 px-6 max-w-7xl mx-auto border-b border-gold/10">
                        <div className="flex flex-col md:flex-row md:items-end justify-between mb-16">
                            <div>
                                <span className="text-[10px] uppercase tracking-ultra text-gold block mb-3">Private Advisory Council</span>
                                <h2 className="font-serif text-3xl md:text-5xl font-light text-ecru">Former Admissions Committee Directors</h2>
                            </div>
                            <p className="text-xs text-ecruMuted max-w-md mt-4 md:mt-0 font-light tracking-wide">
                                Direct, unmediated access to elite scholars and former admissions decision-makers.
                            </p>
                        </div>

                        {/* Faculty Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {COUNSELORS.map((faculty) => (
                                <div key={faculty.id} className="bg-charcoal/40 border border-gold/15 p-6 hover:border-gold/40 transition-all group flex flex-col justify-between">
                                    <div>
                                        <div className="relative overflow-hidden mb-6 h-64 border border-gold/20">
                                            <img 
                                                src={faculty.image} 
                                                alt={faculty.name} 
                                                className="w-full h-full object-cover grayscale contrast-125 group-hover:scale-105 transition-transform duration-500"
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-obsidian via-transparent to-transparent"></div>
                                            <div className="absolute bottom-3 left-3 bg-obsidian/80 px-2 py-1 text-[9px] uppercase tracking-widest text-gold border border-gold/20">
                                                {faculty.placedCount}
                                            </div>
                                        </div>

                                        <h3 className="font-serif text-2xl text-ecru mb-1">{faculty.name}</h3>
                                        <p className="text-xs text-gold font-light mb-2">{faculty.title}</p>
                                        <p className="text-[11px] text-ecruMuted/80 font-light mb-4">{faculty.pedigree}</p>

                                        <div className="text-[11px] text-ecruMuted border-t border-gold/10 pt-3 mb-6 space-y-1">
                                            <div><span className="text-gold/70">Education:</span> {faculty.education}</div>
                                            <div><span className="text-gold/70">Focus:</span> {faculty.specialization}</div>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => setSelectedFaculty(faculty)}
                                        className="w-full py-2.5 border border-gold/30 text-gold hover:bg-gold hover:text-obsidian text-[10px] uppercase tracking-widest transition-all">
                                        View Full Dossier
                                    </button>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* "By Invitation / Private Assessment Only" Multi-Step Modal */}
                    {isAssessmentOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian/90 backdrop-blur-md">
                            <div className="relative w-full max-w-2xl bg-charcoal border border-gold/40 p-6 md:p-10 shadow-2xl overflow-y-auto max-h-[90vh]">
                                
                                {/* Close Modal Button */}
                                <button 
                                    onClick={() => setIsAssessmentOpen(false)}
                                    className="absolute top-6 right-6 text-gold/60 hover:text-gold text-xs uppercase tracking-widest">
                                    [ Close ]
                                </button>

                                {/* Modal Header */}
                                <div className="mb-8">
                                    <span className="text-[9px] uppercase tracking-ultra text-gold block mb-1">Confidential Admission Vetting Protocol</span>
                                    <h3 className="font-serif text-2xl md:text-3xl text-ecru font-light">
                                        {assessmentStep === 1 && "Step 1: Candidate Identity & Target"}
                                        {assessmentStep === 2 && "Step 2: Academic Standing & Distinction"}
                                        {assessmentStep === 3 && "Step 3: Consultation Format & Schedule"}
                                        {assessmentStep === 4 && "Step 4: Private Dossier Issue"}
                                    </h3>
                                    
                                    {/* Progress Step Indicator */}
                                    <div className="flex space-x-2 mt-4">
                                        {[1, 2, 3, 4].map(step => (
                                            <div 
                                                key={step} 
                                                className={`h-1 flex-1 transition-all ${step <= assessmentStep ? 'bg-gold' : 'bg-gold/20'}`}
                                            />
                                        ))}
                                    </div>
                                </div>

                                {/* Form Content */}
                                <form onSubmit={handleAssessmentSubmit}>
                                    
                                    {/* Step 1 */}
                                    {assessmentStep === 1 && (
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Full Name of Candidate</label>
                                                <input 
                                                    type="text" 
                                                    required
                                                    value={formData.candidateName}
                                                    onChange={e => setFormData({...formData, candidateName: e.target.value})}
                                                    placeholder="e.g., Lord / Lady / Regent Name"
                                                    className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold"
                                                />
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Confidential Email</label>
                                                    <input 
                                                        type="email" 
                                                        required
                                                        value={formData.email}
                                                        onChange={e => setFormData({...formData, email: e.target.value})}
                                                        placeholder="candidate@domain.com"
                                                        className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Direct Contact Number</label>
                                                    <input 
                                                        type="tel" 
                                                        required
                                                        value={formData.phone}
                                                        onChange={e => setFormData({...formData, phone: e.target.value})}
                                                        placeholder="+91 98765 43210"
                                                        className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold"
                                                    />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Target Intake Academic Year</label>
                                                <select 
                                                    value={formData.targetTrack}
                                                    onChange={e => setFormData({...formData, targetTrack: e.target.value})}
                                                    className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold">
                                                    <option value="Undergraduate 2027">Undergraduate 2027 Intake</option>
                                                    <option value="Postgraduate 2027">Postgraduate / Masters 2027 Intake</option>
                                                    <option value="MBA 2027">M7 MBA 2027 Intake</option>
                                                    <option value="Doctorate 2027">Doctorate / Ph.D. Intake</option>
                                                </select>
                                            </div>
                                        </div>
                                    )}

                                    {/* Step 2 */}
                                    {assessmentStep === 2 && (
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Current Institution or Company</label>
                                                <input 
                                                    type="text" 
                                                    required
                                                    value={formData.currentStanding}
                                                    onChange={e => setFormData({...formData, currentStanding: e.target.value})}
                                                    placeholder="e.g., The Doon School / IIT Delhi / McKinsey & Co."
                                                    className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Key Distinction or Portfolio Highlight</label>
                                                <textarea 
                                                    rows="3"
                                                    value={formData.distinctions}
                                                    onChange={e => setFormData({...formData, distinctions: e.target.value})}
                                                    placeholder="Detail GPA standing, published papers, founder history, or athletic representation..."
                                                    className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    {/* Step 3 */}
                                    {assessmentStep === 3 && (
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gold block mb-2">Consultation Format</label>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <label className={`p-4 border cursor-pointer text-xs transition-all ${formData.consultationMode === 'Gurugram Private Lounge' ? 'border-gold bg-gold/10' : 'border-gold/20 bg-obsidian'}`}>
                                                        <input 
                                                            type="radio" 
                                                            name="consultMode" 
                                                            checked={formData.consultationMode === 'Gurugram Private Lounge'}
                                                            onChange={() => setFormData({...formData, consultationMode: 'Gurugram Private Lounge'})}
                                                            className="hidden"
                                                        />
                                                        <div className="font-serif text-sm text-gold mb-1">Gurugram Lounge</div>
                                                        <div className="text-[10px] text-ecruMuted">DLF Cyber City, Phase III, Gurugram</div>
                                                    </label>

                                                    <label className={`p-4 border cursor-pointer text-xs transition-all ${formData.consultationMode === 'Encrypted Virtual Suite' ? 'border-gold bg-gold/10' : 'border-gold/20 bg-obsidian'}`}>
                                                        <input 
                                                            type="radio" 
                                                            name="consultMode" 
                                                            checked={formData.consultationMode === 'Encrypted Virtual Suite'}
                                                            onChange={() => setFormData({...formData, consultationMode: 'Encrypted Virtual Suite'})}
                                                            className="hidden"
                                                        />
                                                        <div className="font-serif text-sm text-gold mb-1">Virtual Vault</div>
                                                        <div className="text-[10px] text-ecruMuted">Encrypted 256-bit Video Conference</div>
                                                    </label>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Preferred Consultation Date</label>
                                                <input 
                                                    type="date" 
                                                    required
                                                    value={formData.preferredDate}
                                                    onChange={e => setFormData({...formData, preferredDate: e.target.value})}
                                                    className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold"
                                                />
                                            </div>

                                            <div>
                                                <label className="text-[10px] uppercase tracking-widest text-gold block mb-1">Access Code / Family Referral Token</label>
                                                <input 
                                                    type="text" 
                                                    value={formData.referralCode}
                                                    onChange={e => setFormData({...formData, referralCode: e.target.value})}
                                                    className="w-full bg-obsidian border border-gold/20 text-ecru text-xs p-3 focus:outline-none focus:border-gold"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    {/* Step 4 Confirmation */}
                                    {assessmentStep === 4 && (
                                        <div className="text-center py-6 space-y-4">
                                            <div className="w-16 h-16 border border-gold text-gold flex items-center justify-center mx-auto text-xl font-serif">
                                                ✓
                                            </div>
                                            <h4 className="font-serif text-2xl text-gold">Dossier Generated</h4>
                                            <div className="p-4 bg-obsidian border border-gold/30 text-center">
                                                <div className="text-[9px] uppercase tracking-superwide text-ecruMuted">Unique Assessment Dossier ID</div>
                                                <div className="font-serif text-2xl text-gold tracking-widest mt-1">{generatedDossierId}</div>
                                            </div>
                                            <p className="text-xs text-ecruMuted font-light leading-relaxed">
                                                Your confidential profile for <span className="text-gold">{formData.candidateName}</span> has been dispatched to Senior Managing Partner Dr. Evelyn Vance. A private liaison will contact you within 12 hours.
                                            </p>
                                        </div>
                                    )}

                                    {/* Buttons Footer */}
                                    <div className="mt-8 pt-6 border-t border-gold/10 flex justify-between">
                                        {assessmentStep > 1 && assessmentStep < 4 && (
                                            <button 
                                                type="button"
                                                onClick={() => setAssessmentStep(prev => prev - 1)}
                                                className="px-6 py-2.5 border border-gold/20 text-ecruMuted text-xs uppercase tracking-widest">
                                                Back
                                            </button>
                                        )}
                                        <button 
                                            type="submit"
                                            className="ml-auto px-8 py-3 bg-gold text-obsidian text-xs uppercase tracking-ultra font-semibold hover:bg-gold-light transition-all">
                                            {assessmentStep === 3 ? "Generate Dossier" : assessmentStep === 4 ? "Complete & Close" : "Continue Protocol"}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Faculty Dossier Modal */}
                    {selectedFaculty && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian/90 backdrop-blur-md">
                            <div className="relative w-full max-w-xl bg-charcoal border border-gold/40 p-8 shadow-2xl">
                                <button 
                                    onClick={() => setSelectedFaculty(null)}
                                    className="absolute top-6 right-6 text-gold/60 hover:text-gold text-xs uppercase tracking-widest">
                                    [ Close ]
                                </button>

                                <div className="flex items-center space-x-4 mb-6">
                                    <img src={selectedFaculty.image} className="w-20 h-20 object-cover border border-gold/30" />
                                    <div>
                                        <h3 className="font-serif text-2xl text-ecru">{selectedFaculty.name}</h3>
                                        <p className="text-xs text-gold">{selectedFaculty.title}</p>
                                        <p className="text-[10px] text-ecruMuted mt-1">{selectedFaculty.pedigree}</p>
                                    </div>
                                </div>

                                <p className="text-xs text-ecruMuted font-light leading-relaxed mb-6 italic border-l-2 border-gold/40 pl-4">
                                    "{selectedFaculty.bio}"
                                </p>

                                <div className="space-y-3 text-xs border-t border-gold/10 pt-4 mb-6">
                                    <div><span className="text-gold">Education Credentials:</span> {selectedFaculty.education}</div>
                                    <div><span className="text-gold">Primary Advisory Focus:</span> {selectedFaculty.specialization}</div>
                                    <div><span className="text-gold">Proven Track Record:</span> {selectedFaculty.placedCount}</div>
                                </div>

                                <button 
                                    onClick={() => {
                                        setSelectedFaculty(null);
                                        setAssessmentStep(1);
                                        setIsAssessmentOpen(true);
                                    }}
                                    className="w-full py-3 bg-gold text-obsidian text-xs uppercase tracking-ultra font-semibold">
                                    Request Direct Consultation with {selectedFaculty.name.split(' ')[1]}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Client Portal Modal */}
                    {isPortalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-obsidian/95 backdrop-blur-lg">
                            <div className="relative w-full max-w-md bg-charcoal border border-gold/30 p-8 text-center">
                                <button 
                                    onClick={() => setIsPortalOpen(false)}
                                    className="absolute top-6 right-6 text-gold/60 hover:text-gold text-xs uppercase tracking-widest">
                                    [ Exit ]
                                </button>

                                <div className="w-12 h-12 border border-gold/40 flex items-center justify-center mx-auto mb-4">
                                    <span className="font-serif italic text-gold text-xl">SÉ</span>
                                </div>

                                <h3 className="font-serif text-2xl text-ecru mb-2">Private Client Vault</h3>
                                <p className="text-[10px] uppercase tracking-widest text-gold mb-6">Encrypted Candidate Dossier Portal</p>

                                <div className="space-y-4">
                                    <input 
                                        type="password" 
                                        placeholder="Enter Candidate Vault Key"
                                        value={portalPasscode}
                                        onChange={e => setPortalPasscode(e.target.value)}
                                        className="w-full bg-obsidian border border-gold/20 text-center text-ecru text-xs p-3 focus:outline-none focus:border-gold tracking-widest"
                                    />
                                    {portalError && <p className="text-[10px] text-red-400">Invalid Vault Key. Access Restricted.</p>}
                                    <button 
                                        onClick={() => {
                                            if (portalPasscode === "SOMAH2027") {
                                                setIsPortalOpen(false);
                                                showToast("Welcome back. Vault Key Accepted.");
                                            } else {
                                                setPortalError(true);
                                            }
                                        }}
                                        className="w-full py-3 bg-gold text-obsidian text-xs uppercase tracking-ultra font-semibold">
                                        Authenticate Session
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="py-16 px-6 max-w-7xl mx-auto border-t border-gold/10 text-xs text-ecruMuted">
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-10 mb-12">
                            
                            {/* Col 1 */}
                            <div className="space-y-3">
                                <div className="font-serif text-xl text-ecru">SOMAH ÉDU</div>
                                <p className="text-[11px] font-light leading-relaxed">
                                    Somah EduSolutions Pvt. Ltd.<br />
                                    EduAbroad International Education Consultants<br />
                                    Gurugram, Haryana, India.
                                </p>
                            </div>

                            {/* Col 2 */}
                            <div>
                                <span className="text-[10px] uppercase tracking-widest text-gold block mb-3 font-medium">Headquarters</span>
                                <p className="text-[11px] font-light leading-relaxed">
                                    Level 14, DLF Cyber City, Phase III<br />
                                    Gurugram, Haryana 122002<br />
                                    India
                                </p>
                            </div>

                            {/* Col 3 */}
                            <div>
                                <span className="text-[10px] uppercase tracking-widest text-gold block mb-3 font-medium">Confidential Enquiries</span>
                                <p className="text-[11px] font-light leading-relaxed">
                                    Direct: +91 (0) 124 480 0000<br />
                                    Vault: concierge@somahedu.com<br />
                                    Monogram: SÉ-PRIVATE-NET
                                </p>
                            </div>

                            {/* Col 4 */}
                            <div>
                                <span className="text-[10px] uppercase tracking-widest text-gold block mb-3 font-medium">Security & Compliance</span>
                                <p className="text-[11px] font-light leading-relaxed">
                                    All candidate records encrypted under 256-bit NDA compliance standards. Limited 30-candidate allocation active.
                                </p>
                            </div>
                        </div>

                        <div className="pt-8 border-t border-gold/10 flex flex-col sm:flex-row items-center justify-between text-[10px] tracking-widest">
                            <div>© 2026 SOMAH EDUSOLUTIONS PVT. LTD. ALL RIGHTS RESERVED.</div>
                            <div className="mt-4 sm:mt-0 flex space-x-6">
                                <a href="#" onClick={(e) => { e.preventDefault(); showToast("Encrypted NDA Disclaimers loaded."); }} className="hover:text-gold">PRIVACY DISCLOSURE</a>
                                <a href="#" onClick={(e) => { e.preventDefault(); showToast("Institutional Ethics code loaded."); }} className="hover:text-gold">ETHICS CODE</a>
                                <a href="#" onClick={(e) => { e.preventDefault(); setIsPortalOpen(true); }} className="hover:text-gold text-gold">CLIENT VAULT</a>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        // Render application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
